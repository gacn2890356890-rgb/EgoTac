[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egotouch-training"
version = "0.1.0"
description = "Frozen-visual-feature tactile decoder training and evaluation"
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[project.scripts]
egotouch-train = "egotouch.train:main"
egotouch-evaluate = "egotouch.evaluate:main"
egotouch-check-data = "egotouch.data:main"
egotouch-export-manifest = "egotouch.export_manifest:main"

[tool.setuptools.packages.find]
where = ["src"]
