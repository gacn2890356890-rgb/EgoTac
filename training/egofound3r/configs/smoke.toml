# Short end-to-end run, identical for both variants except train.variant and train.output_dir.
[model]
upstream_config = "${EGOTAC_ROOT}/configs/default.toml"
checkpoint = ""

[data]
clips = "${EGOTAC_ROOT}/data/clips_smoke"
image_size = 256
image_mode = "center_crop"
workers = 4
augment = true

[train]
variant = "baseline"
output_dir = "${EGOTAC_ROOT}/outputs/smoke_baseline"
steps = 300
batch_size = 2
lr = 2.5e-4       # Table 5
lr_min = 1.0e-5   # Table 5
warmup_steps = 100  # Table 5
weight_decay = 0.01  # Table 5
grad_clip = 1.0   # Table 5
strides = [5]     # stride 1-4 cost more memory; proportions are unpublished
stride_weights = [1.0]
log_every = 10
save_every = 300
eval_every = 150
seed = 0

[world]
past_frames = 16
horizon = 5
dim = 256
layers = 4
heads = 8
dynamics_layers = 2
eval_samples = 4
eval_steps = 5
